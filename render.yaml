services:
  - type: web
    name: leeway-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    # Ruled out as the cause of the 2026-07-29 outage, so it stays. The theory
    # was that Render's 5-second poll of this path kept the container looking
    # healthy from the inside while its external route went stale. Removing it
    # and letting the instance idle for 21 minutes with no traffic at all
    # changed nothing: the wake attempt still timed out at 300s with zero bytes
    # after a completed TLS handshake. The break is on Render's side of the
    # edge, not something this file controls.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ORS_API_KEY
        sync: false
      - key: OCM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
